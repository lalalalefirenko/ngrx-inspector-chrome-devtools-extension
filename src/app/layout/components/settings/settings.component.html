<section class="settings-page" aria-labelledby="settings-title">
  <h2 id="settings-title">Settings</h2>

  <section aria-labelledby="filters-title">
    <h3 id="filters-title">Hide actions by prefix</h3>
    <form class="add-filter" (ngSubmit)="add(); prefixInput.focus()">
      <input
        #prefixInput
        name="prefix"
        aria-label="Action name prefix to hide"
        [(ngModel)]="newPattern"
        placeholder="e.g. [Users]"
        autocomplete="off"
        spellcheck="false"
        class="filter-input"
      />
      <button
        type="submit"
        class="tool-button tool-button--accent add-btn"
        aria-label="Add prefix filter"
        [disabled]="!newPattern.trim()"
      >
        Add
      </button>
    </form>

    <hr class="prefixes-separator" />
    <h4 class="prefix-list-title" id="prefix-list-title">Prefixes to hide</h4>
    <ul class="filters" aria-labelledby="prefix-list-title">
      @for (filter of filters(); track filter.id) {
        <li class="filter-item">
          <label class="filter-label">
            <input
              type="checkbox"
              [checked]="filter.enabled"
              [attr.aria-label]="'Hide actions starting with ' + filter.pattern"
              [attr.aria-describedby]="
                filter.readonly ? 'filter-info-' + filter.id : null
              "
              (change)="toggle(filter.id)"
            />
            <span class="filter-content">
              <span class="filter-name">
                <code class="filter-text">{{ filter.pattern }}</code>
                @if (filter.readonly) {
                  <span
                    class="default-badge"
                    title="Included with the extension"
                    >Built-in</span
                  >
                }
              </span>
              @if (filter.readonly) {
                <span
                  class="filter-description"
                  [id]="'filter-info-' + filter.id"
                >
                  NgRx internal actions
                </span>
              }
            </span>
          </label>

          @if (!filter.readonly) {
            <button
              class="tool-button tool-button--icon tool-button--danger remove-btn"
              type="button"
              [attr.aria-label]="'Remove filter ' + filter.pattern"
              title="Remove filter"
              (click)="remove(filter.id)"
            >
              <clear-all-svg
                width="16px"
                height="16px"
                fill="currentColor"
                aria-hidden="true"
              />
            </button>
          }
        </li>
      }
    </ul>
  </section>
</section>
