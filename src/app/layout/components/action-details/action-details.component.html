@if (canDisplayDetails() && selectedAction(); as action) {
  <header class="selected-action-header">
    <strong class="selected-action-type" [title]="action.type">{{ action.type }}</strong>
    <span class="selected-action-id">#{{ action.id }}</span>
    @if (retainedSelectedAction()) {
      <span class="selection-status">Outside current list</span>
    }
  </header>

  <action-details-tabs
    [activeTab]="currentTab()"
    (tabChange)="currentTab.set($event)"
  />

  <div class="tab-content">
    @switch (currentTab()) {
      @case ("payload") {
        <action-payload [action]="action" />
      }
      @case ("state") {
        <action-state
          [action]="action"
          [pinnedPath]="pinnedPath()"
          (pinNode)="pinNode($event)"
          (unpinNode)="unpinNode()"
          (setNewPath)="$event ? pinNode($event) : unpinNode()"
        />
      }
      @case ("diff") {
        <action-diff [action]="action" [previousAction]="selectedPreviousAction()" />
      }
    }
  </div>
}
