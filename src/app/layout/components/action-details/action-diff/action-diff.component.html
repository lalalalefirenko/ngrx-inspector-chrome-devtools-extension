@if (!hasPreviousState()) {
  <p class="equal-states-msg">previous state is unavailable</p>
} @else {
  @for (feature of features(); track feature.key) {
    <div class="feature">
      <diff-tree [node]="feature"></diff-tree>
    </div>
  } @empty {
    <p class="equal-states-msg">states are equal</p>
  }
}
