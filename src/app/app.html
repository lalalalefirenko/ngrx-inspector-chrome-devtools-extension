<div class="layout">
  <aside>
    <input
      class="filter"
      placeholder="search... minimum 2 symbols required"
      [formControl]="searchControl"
    />
    <div
      class="connection-status"
      role="status"
      aria-atomic="true"
      [attr.data-state]="connectionStatus()"
      [title]="connectionInfo().description"
    >
      <span class="status-dot" aria-hidden="true"></span>
      <span>{{ connectionInfo().label }}</span>
    </div>
    <actions-list (actionClicked)="closeSettings()" />
  </aside>
  <main>
    <action-details [canDisplayDetails]="!isSettingsOpened()" />
    @if (isSettingsOpened()) {
      <app-settings (close)="closeSettings()" />
    }

    <button
      type="button"
      class="tool-button tool-button--icon floating-btn settings-btn"
      title="Settings"
      aria-label="Settings"
      [attr.aria-expanded]="isSettingsOpened()"
      (click)="toggleSettings()"
    >
      <settings-svg width="18px" height="18px" fill="currentColor" aria-hidden="true" />
    </button>
    <button
      type="button"
      class="tool-button tool-button--icon tool-button--danger floating-btn clear-btn"
      title="Clear history"
      aria-label="Clear history"
      (click)="clearActionsData()"
    >
      <clear-all-svg width="18px" height="18px" fill="currentColor" aria-hidden="true" />
    </button>
  </main>
</div>
